[project]
name = "salon-booking-bot"
version = "1.0.0"
description = "Telegram-бот записи клиентов салона: aiogram 3, PostgreSQL, SQLAlchemy 2, Taskiq"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.15,<4.0",
    "aiogram-dialog>=2.3,<3.0",
    "sqlalchemy>=2.0,<2.1",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "taskiq>=0.11",
    "taskiq-redis>=1.0",
    "redis>=5.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # bugbear
    "SIM",    # simplify
    "ASYNC",  # async pitfalls
    "RUF",    # ruff-specific
]
# RUF001-003 ложно срабатывают на кириллицу в русскоязычных строках и докстрингах.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Alembic env.py выполняет код на верхнем уровне модуля — это его контракт.
"migrations/env.py" = ["E402"]
